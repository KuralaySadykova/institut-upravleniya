  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232c5547'/%3E%3Cpath d='M10 29V11h5v13h15v5H10zm9-18h11v5H19v-5zm0 8h11v5H19v-5z' fill='%23f4efe3'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#202923;--muted:#778078;--paper:#f5f4ef;--white:#fff;--line:#e9e8e1;--green:#2c5547;--green-dark:#203f35;--mint:#e5eee8;--yellow:#e7c36d;--sand:#f1ebdd;--red:#a74638;--shadow:0 18px 48px rgba(27,42,34,.07);font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:var(--paper)}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #d8ac52;outline-offset:3px}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--green);color:#f8f7f1;padding:28px 18px;display:flex;flex-direction:column;gap:38px}.brand{display:flex;align-items:center;gap:11px;padding:2px 7px}.brand-mark{width:38px;height:38px;border:1px solid #829a88;border-radius:12px;display:grid;place-items:center;font-family:Georgia,serif;font-size:19px;color:#f0d994}.brand-name{font-family:Georgia,serif;font-size:16px;line-height:1.13;letter-spacing:.01em}.nav-label{padding:0 12px;margin-bottom:9px;text-transform:uppercase;font-size:10px;letter-spacing:.14em;color:#abc0b3}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d4dfd7;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer;font-size:13px}.nav button:hover,.nav button.active{background:#416555;color:white}.nav-icon{width:18px;text-align:center;font-size:15px}.side-bottom{margin-top:auto;border-top:1px solid #4d6e5d;padding:18px 8px 0;color:#dce5df;font-size:11px;line-height:1.6}.side-bottom span{color:#f1d48d}.main{min-width:0;padding:28px clamp(22px,4.4vw,68px) 52px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:31px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:#3b4d41;font-weight:600}.user{display:flex;align-items:center;gap:9px;font-size:12px;color:#586159}.avatar{display:grid;place-items:center;width:33px;height:33px;border-radius:50%;background:#e6dac0;color:#675333;font-weight:700}.welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--green);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:9px}.welcome h1{font:400 clamp(28px,3vw,39px)/1.12 Georgia,"Times New Roman",serif;letter-spacing:-.025em;margin:0}.welcome p{font-size:13px;color:var(--muted);margin:9px 0 0}.date{font-size:11px;color:var(--muted);white-space:nowrap;padding-bottom:3px}.stats{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:13px;margin:24px 0 35px}.stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:17px 18px}.stat:first-child{background:var(--green);color:white;border-color:var(--green)}.stat-label{font-size:11px;opacity:.76}.stat-value{display:flex;align-items:baseline;gap:7px;margin-top:13px;font:400 27px/1 Georgia,serif}.stat-value small{font:400 11px Inter,"Segoe UI",sans-serif;opacity:.75}.progress-track{height:4px;border-radius:9px;background:rgba(255,255,255,.22);margin-top:13px;overflow:hidden}.progress-fill{height:100%;background:#e6ca81;border-radius:9px;transition:width .25s}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:15px}.section-head h2{font:400 23px/1.1 Georgia,serif;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:6px 0 0}.link-button{border:0;background:transparent;color:var(--green);font-size:12px;padding:8px 0;cursor:pointer}.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.course-card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;display:flex;flex-direction:column;min-height:215px;transition:transform .18s,box-shadow .18s}.course-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#607568;background:var(--mint);border-radius:30px;padding:6px 8px}.duration{color:var(--muted);font-size:10px}.course-card h3{font:400 20px/1.15 Georgia,serif;margin:17px 0 7px}.course-card p{font-size:11px;line-height:1.55;color:var(--muted);margin:0}.course-bottom{margin-top:auto;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:9px}.course-count{font-size:10px;color:var(--muted)}.status-check{display:flex;align-items:center;gap:7px;color:#65736b;font-size:10px;cursor:pointer}.status-check input,.topic-check{accent-color:var(--green);width:15px;height:15px;cursor:pointer}.primary{border:0;background:var(--green);color:white;border-radius:8px;padding:9px 13px;font-size:11px;cursor:pointer}.primary:hover{background:var(--green-dark)}.lower-grid{display:grid;grid-template-columns:1.22fr .78fr;gap:15px;margin-top:28px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:19px}.panel h2{font:400 19px/1.15 Georgia,serif;margin:0 0 14px}.topic-list{display:grid}.topic-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:11px}.topic-row:first-child{border-top:0}.topic-course{display:block;font-size:9px;color:var(--muted);margin-top:3px}.state{font-size:9px;color:#768077;white-space:nowrap}.state.done{color:var(--green);font-weight:600}.book{display:flex;gap:13px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.book:first-of-type{border-top:0}.book-cover{width:42px;height:54px;flex:none;border-radius:3px 7px 7px 3px;background:#dfe8df;color:var(--green);display:grid;place-items:center;font:18px Georgia,serif;box-shadow:inset 4px 0 rgba(33,76,57,.12)}.book:nth-of-type(3) .book-cover{background:#f0e5cb;color:#776237}.book h3{font:400 13px Georgia,serif;margin:0 0 5px}.book p{font-size:9px;color:var(--muted);margin:0 0 7px}.small-action{border:0;background:none;color:var(--green);font-size:10px;padding:0;cursor:pointer}.view-title{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}.view-title h1{font:400 33px Georgia,serif;margin:0}.view-title span{color:var(--muted);font-size:11px}.view-list{display:grid;gap:10px}.resource-row{display:grid;grid-template-columns:42px 1fr auto;gap:15px;align-items:center;background:white;border:1px solid var(--line);border-radius:13px;padding:15px 17px}.resource-row h3{font:400 17px Georgia,serif;margin:0 0 5px}.resource-row p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}.empty{padding:35px;color:var(--muted);font-size:12px}.quiz-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.quiz-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.quiz-card h3{font:400 19px Georgia,serif;margin:10px 0 7px}.quiz-card p{font-size:11px;line-height:1.55;color:var(--muted)}.quiz-meta{display:flex;gap:12px;color:var(--muted);font-size:10px;margin:13px 0}.quiz-card .primary{margin-top:3px}.quiz-result{font-size:10px;color:var(--green);margin-left:8px}.modal-backdrop{position:fixed;inset:0;background:rgba(24,36,29,.5);display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(510px,100%);background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 24px 80px #10261b4a}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.modal h2{font:400 24px Georgia,serif;margin:0}.modal-sub{font-size:11px;color:var(--muted);margin:7px 0 18px}.close{border:0;background:#e9e8e1;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:17px}.question{border-top:1px solid var(--line);padding:15px 0}.question-title{font-size:12px;font-weight:600;margin-bottom:10px}.option{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;font-size:11px;border-radius:7px;cursor:pointer}.option:hover{background:white}.option input{accent-color:var(--green);margin:0}.quiz-footer{display:flex;justify-content:space-between;align-items:center;gap:12px}.feedback{font-size:11px;color:var(--green)}.hidden{display:none!important}.footer-note{color:var(--muted);font-size:9px;margin-top:24px}
    @media(max-width:1000px){.app{grid-template-columns:205px 1fr}.main{padding:25px 25px 42px}.courses{grid-template-columns:repeat(2,minmax(0,1fr))}.course-card:last-child{display:none}}
    @media(max-width:700px){.app{display:block}.sidebar{position:sticky;top:0;z-index:3;padding:10px 13px;display:flex;flex-direction:row;align-items:center;gap:13px;box-shadow:0 4px 14px #1a332720}.brand{padding:0}.brand-mark{width:32px;height:32px}.brand-name{font-size:13px}.nav-label,.side-bottom{display:none}.nav-wrap{margin-left:auto}.nav{display:flex;gap:2px}.nav button{padding:8px;border-radius:8px}.nav button .nav-icon{font-size:16px}.nav-text{display:none}.main{padding:20px 16px 36px}.topbar{margin-bottom:23px}.welcome{align-items:start}.date{display:none}.stats{gap:7px;margin:18px 0 28px}.stat{padding:12px}.stat-label{font-size:9px}.stat-value{font-size:21px;margin-top:11px}.stat-value small{font-size:9px}.courses{grid-template-columns:1fr}.course-card:last-child{display:flex}.course-card{min-height:195px}.lower-grid{grid-template-columns:1fr}.quiz-list{grid-template-columns:1fr}.view-title h1{font-size:28px}.resource-row{grid-template-columns:38px 1fr}.resource-row .primary,.resource-row .status-check{grid-column:2}.resource-row .primary{justify-self:start}}
    @media(max-width:380px){.brand-name{max-width:100px}.stats{grid-template-columns:1fr 1fr}.stat:first-child{grid-column:1/-1}.nav button{padding:7px}}
  </style>

<body>
  <div class="app">
    <aside class="sidebar" aria-label="Основная навигация">
      <div class="brand"><div class="brand-mark" aria-hidden="true">ИУ</div><div class="brand-name">Институт<br>управления</div></div>
      <div class="nav-wrap"><div class="nav-label">Обучение</div><nav class="nav" id="nav">
        <button class="active" data-view="overview"><span class="nav-icon">⌂</span><span class="nav-text">Обзор</span></button>
        <button data-view="courses"><span class="nav-icon">▤</span><span class="nav-text">Курсы</span></button>
        <button data-view="books"><span class="nav-icon">▧</span><span class="nav-text">Учебники</span></button>
        <button data-view="topics"><span class="nav-icon">◫</span><span class="nav-text">Темы</span></button>
        <button data-view="tests"><span class="nav-icon">✓</span><span class="nav-text">Тесты</span></button>
      </nav></div>
      <div class="side-bottom">Ваш учебный кабинет<br><span>Знания складываются в систему.</span></div>
    </aside>
    <main class="main">
      <div class="topbar"><div class="crumb">Обучение <span aria-hidden="true">/</span> <strong id="crumb">Обзор</strong></div><div class="user"><span>Мой кабинет</span><span class="avatar" aria-hidden="true">У</span></div></div>
      <div id="view"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <script>
    const courses=[
      {id:'project',title:'Основы управления проектами',category:'Управление',duration:'6 тем · 4 ч',description:'От постановки цели до оценки результата: базовые инструменты проектной работы.',topics:['Проект и его жизненный цикл','Цели и критерии успеха','Планирование сроков','Риски и ограничения','Команда проекта','Контроль и завершение']},
      {id:'strategy',title:'Стратегический менеджмент',category:'Менеджмент',duration:'5 тем · 3 ч',description:'Как анализировать среду, выбирать направление и превращать стратегию в действия.',topics:['Миссия и видение','Анализ внешней среды','Конкурентные преимущества','Выбор стратегии','Показатели и контроль']},
      {id:'people',title:'Управление командой',category:'Люди и команды',duration:'5 тем · 3 ч',description:'Роли, обратная связь и рабочие договорённости для сильной команды.',topics:['Роли в команде','Постановка задач','Мотивация сотрудников','Обратная связь','Разрешение конфликтов']}
    ];
    const books=[
      {id:'book-management',title:'Практика менеджмента',author:'Учебное пособие · 4 главы',symbol:'М',chapters:[['Что делает менеджер','Менеджер связывает цели организации с ежедневной работой команды: распределяет ответственность, помогает принимать решения и следит за результатом.'],['Цели и решения','Хорошая цель описывает нужный результат. Перед выбором решения полезно собрать факты, сравнить возможные действия и заранее определить критерии успеха.'],['Организация работы','Понятные роли, реалистичные сроки и регулярная обратная связь помогают людям действовать согласованно и замечать отклонения до того, как они станут проблемой.'],['Результаты и развитие','Итог работы оценивают по заранее согласованным показателям. Выводы из результата становятся основой для улучшений и следующего цикла планирования.']]},
      {id:'book-project',title:'Управление проектами: основы',author:'Учебник · 4 главы',symbol:'П',chapters:[['Проект и жизненный цикл','Проект — ограниченная по времени работа, которая создаёт уникальный результат. Обычно он проходит через запуск, планирование, исполнение, контроль и завершение.'],['План и критерии успеха','План связывает объём работ, сроки, ресурсы и ответственных. Критерии успеха согласуют до начала работ, чтобы команда одинаково понимала ожидаемый результат.'],['Риски и команда','Риск — неопределённое событие, которое может повлиять на проект. Для важных рисков заранее назначают ответственного и готовят возможные действия.'],['Контроль и завершение','Контрольные точки показывают, соответствует ли фактический ход работ плану. При завершении команда принимает результат, фиксирует уроки и закрывает обязательства.']]},
      {id:'book-team',title:'Команда и лидерство',author:'Учебное пособие · 4 главы',symbol:'К',chapters:[['Роли и договорённости','Команде легче работать, когда каждый знает свою роль, зону ответственности и способ согласования решений. Договорённости стоит записать и пересматривать по мере изменений.'],['Постановка задач','В задаче полезно обозначить ожидаемый результат, срок, ответственного и доступные ресурсы. Проверка понимания до начала работы уменьшает переделки.'],['Мотивация и обратная связь','Своевременная обратная связь опирается на конкретное действие, его эффект и следующий шаг. Она помогает сохранить рабочий разговор и улучшать результат.'],['Разногласия и развитие','Разногласие можно разобрать через интересы сторон и общую цель. После обсуждения важно зафиксировать решение, ответственных и момент повторной проверки.']]}
    ];
    const quizzes=[
      {id:'quiz-project',title:'Основы управления проектами',course:'project',questions:[{q:'Что в первую очередь определяет цель проекта?',a:['Ожидаемый результат и критерии его достижения','Список всех задач команды','Количество участников'],correct:0},{q:'Для чего выявляют риски на старте?',a:['Чтобы гарантировать отсутствие проблем','Чтобы заранее подготовить меры реагирования','Чтобы увеличить длительность проекта'],correct:1},{q:'Что помогает понять, укладывается ли команда в план?',a:['Контрольные точки и показатели выполнения','Только итоговый отчёт','Число совещаний'],correct:0}]},
      {id:'quiz-strategy',title:'Стратегический менеджмент',course:'strategy',questions:[{q:'На какой период обычно ориентирована стратегия?',a:['На долгосрочное развитие организации','На одну рабочую смену','Только на ближайшую задачу'],correct:0},{q:'Что помогает оценить внешнюю среду организации?',a:['Анализ рынка и его изменений','Табель рабочего времени','Расписание совещаний'],correct:0},{q:'Зачем стратегии нужны показатели?',a:['Чтобы отслеживать движение к целям','Чтобы заменить цели','Чтобы исключить обсуждения'],correct:0}]},
      {id:'quiz-people',title:'Управление командой',course:'people',questions:[{q:'Что делает рабочую задачу понятной?',a:['Ожидаемый результат, срок и ответственный','Только устное напоминание','Срочность без пояснений'],correct:0},{q:'На чём строится полезная обратная связь?',a:['На наблюдаемом действии и его влиянии','На личных оценках человека','На сравнении с коллегой'],correct:0},{q:'Как лучше разрешать разногласие в команде?',a:['Обсудить интересы и согласовать следующий шаг','Отложить разговор навсегда','Сразу назначить виноватого'],correct:0}]}
    ];
    const storageKey='institut-upravleniya-progress-v1';
    let progress={topics:{},courses:{},scores:{}};
    let activeView='overview';
    try{progress=Object.assign(progress,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch{}
    const save=()=>localStorage.setItem(storageKey,JSON.stringify(progress));
    const totalTopics=courses.reduce((n,c)=>n+c.topics.length,0);
    const doneCount=()=>Object.values(progress.topics).filter(Boolean).length;
    const courseDone=id=>courses.find(c=>c.id===id)?.topics.every((_,i)=>progress.topics[id+'-'+i])||false;
    const pct=()=>Math.round(doneCount()/totalTopics*100);
    const view=document.querySelector('#view');
    const crumb=document.querySelector('#crumb');
    function go(name){activeView=name;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));crumb.textContent=({overview:'Обзор',courses:'Курсы',books:'Учебники',topics:'Темы',tests:'Тесты'})[name];name==='overview'?renderOverview():name==='courses'?renderCourses():name==='books'?renderBooks():name==='topics'?renderTopics():renderQuizzes();window.scrollTo(0,0)}
    document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)go(b.dataset.view)});
    function courseCards(list){return `<div class="courses">${list.map(c=>`<article class="course-card"><div class="card-top"><span class="tag">${c.category}</span><span class="duration">${c.duration}</span></div><h3>${c.title}</h3><p>${c.description}</p><div class="course-bottom"><label class="status-check"><input type="checkbox" data-course="${c.id}" ${courseDone(c.id)?'checked':''}><span>Курс пройден</span></label><button class="primary" data-open-course="${c.id}">Открыть курс</button></div></article>`).join('')}</div>`}
    function topicRows(limit=5){const all=courses.flatMap(c=>c.topics.map((t,i)=>({c,t,i})));return all.slice(0,limit).map(({c,t,i})=>{const key=c.id+'-'+i,done=!!progress.topics[key];return `<label class="topic-row"><input class="topic-check" type="checkbox" data-topic="${key}" ${done?'checked':''}><span>${t}<span class="topic-course">${c.title}</span></span><span class="state ${done?'done':''}">${done?'Пройдено':'Не пройдено'}</span></label>`}).join('')}
    function bookRows(list=books){return list.map(b=>`<article class="resource-row"><div class="book-cover" aria-hidden="true">${b.symbol}</div><div><h3>${b.title}</h3><p>${b.author}</p></div><button class="primary" data-book="${b.id}">Открыть</button></article>`).join('')}
    function renderOverview(){view.innerHTML=`<header class="welcome"><div><div class="eyebrow">Институт управления</div><h1>Ваш путь в обучении</h1><p>Выберите курс и продолжайте в своём темпе.</p></div><div class="date">Учебный кабинет</div></header><section class="stats" aria-label="Прогресс обучения"><div class="stat"><div class="stat-label">Тем пройдено</div><div class="stat-value"><span id="done-stat">${doneCount()}</span><small>из ${totalTopics}</small></div><div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:${pct()}%"></div></div></div><div class="stat"><div class="stat-label">Курсов завершено</div><div class="stat-value"><span id="course-stat">${courses.filter(c=>courseDone(c.id)).length}</span><small>из ${courses.length}</small></div></div><div class="stat"><div class="stat-label">Тестов пройдено</div><div class="stat-value"><span id="quiz-stat">${Object.keys(progress.scores||{}).length}</span><small>из ${quizzes.length}</small></div></div></section><section><div class="section-head"><div><h2>Мои курсы</h2><p>Продолжите обучение с любой темы.</p></div><button class="link-button" data-go="courses">Все курсы →</button></div>${courseCards(courses)}</section><div class="lower-grid"><section class="panel"><h2>Темы курса</h2><div class="topic-list">${topicRows(5)}</div><button class="link-button" data-go="topics">Все темы →</button></section><section class="panel"><h2>Учебники</h2>${books.slice(0,2).map(b=>`<div class="book"><div class="book-cover" aria-hidden="true">${b.symbol}</div><div><h3>${b.title}</h3><p>${b.author}</p><button class="small-action" data-book="${b.id}">Открыть учебник →</button></div></div>`).join('')}<button class="link-button" data-go="books">Все учебники →</button></section></div><p class="footer-note">Отметки и результаты сохраняются в этом браузере.</p>`;bindActions()}
    function renderCourses(){view.innerHTML=`<header class="view-title"><h1>Курсы</h1><span>${courses.length} учебные программы</span></header><p style="font-size:12px;color:var(--muted);margin:-11px 0 20px">Отмечайте темы по мере прохождения. Прогресс курса обновляется автоматически.</p>${courseCards(courses)}<div class="panel" style="margin-top:17px"><h2>Быстрый переход к тестам</h2><p style="color:var(--muted);font-size:11px">Проверьте знания после изучения тем курса.</p><button class="primary" data-go="tests">Все тесты</button></div>`;bindActions()}
    function renderBooks(){view.innerHTML=`<header class="view-title"><h1>Учебники</h1><span>${books.length} материала</span></header><div class="view-list">${bookRows()}</div><p class="footer-note">Материалы открываются в учебном кабинете. Полные тексты можно добавить в следующем шаге.</p>`;bindActions()}
    function renderTopics(){view.innerHTML=`<header class="view-title"><h1>Темы</h1><span>${doneCount()} из ${totalTopics} пройдено</span></header><section class="panel"><div class="topic-list">${topicRows(totalTopics)}</div></section><p class="footer-note">Отметьте тему, чтобы сохранить её как пройденную.</p>`;bindActions()}
    function renderQuizzes(){view.innerHTML=`<header class="view-title"><h1>Тесты</h1><span>Проверка знаний по курсам</span></header><div class="quiz-list">${quizzes.map(q=>`<article class="quiz-card"><span class="tag">${courses.find(c=>c.id===q.course).category}</span><h3>${q.title}</h3><p>Короткий тест по основным понятиям и инструментам курса.</p><div class="quiz-meta"><span>${q.questions.length} вопроса</span><span>Без ограничения по времени</span></div><button class="primary" data-quiz="${q.id}">${progress.scores?.[q.id]?'Пройти ещё раз':'Начать тест'}</button>${progress.scores?.[q.id]?`<span class="quiz-result">Последний результат: ${progress.scores[q.id]}%</span>`:''}</article>`).join('')}</div>`;bindActions()}
    function bindActions(){view.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));view.querySelectorAll('[data-open-course]').forEach(b=>b.addEventListener('click',()=>{go('topics');setTimeout(()=>{const c=courses.find(x=>x.id===b.dataset.openCourse);document.querySelectorAll('.topic-row').forEach(r=>{r.classList.toggle('hidden',!r.querySelector('.topic-course').textContent.includes(c.title))})},0)}));view.querySelectorAll('[data-topic]').forEach(el=>el.addEventListener('change',()=>{progress.topics[el.dataset.topic]=el.checked;save();go(crumb.textContent==='Темы'?'topics':'overview')}));view.querySelectorAll('[data-course]').forEach(el=>el.addEventListener('change',()=>{const c=courses.find(x=>x.id===el.dataset.course);c.topics.forEach((_,i)=>progress.topics[c.id+'-'+i]=el.checked);save();go(crumb.textContent==='Курсы'?'courses':'overview')}));view.querySelectorAll('[data-quiz]').forEach(b=>b.addEventListener('click',()=>openQuiz(b.dataset.quiz)));view.querySelectorAll('[data-book]').forEach(b=>b.addEventListener('click',()=>openBook(b.dataset.book)))}
    function openBook(id){const book=books.find(x=>x.id===id);document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" data-dismiss><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${book.title}</h2><button class="close" aria-label="Закрыть" data-close>×</button></div><p class="modal-sub">${book.author}</p><div class="topic-list">${book.chapters.map((chapter,i)=>`<article class="question"><div class="question-title">${i+1}. ${chapter[0]}</div><p style="font-size:11px;line-height:1.7;color:var(--muted);margin:0">${chapter[1]}</p></article>`).join('')}</div></section></div>`;modalClose()}
    function openQuiz(id){const q=quizzes.find(x=>x.id===id);const root=document.querySelector('#modal-root');root.innerHTML=`<div class="modal-backdrop" data-dismiss><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${q.title}</h2><button class="close" aria-label="Закрыть" data-close>×</button></div><p class="modal-sub">Выберите один ответ на каждый вопрос.</p><form id="quiz-form">${q.questions.map((item,i)=>`<div class="question"><div class="question-title">${i+1}. ${item.q}</div>${item.a.map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${a}</span></label>`).join('')}</div>`).join('')}<div class="quiz-footer"><span class="feedback" id="quiz-feedback" aria-live="polite"></span><button class="primary" type="submit">Проверить ответы</button></div></form></section></div>`;modalClose();root.querySelector('#quiz-form').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget);if(q.questions.some((_,i)=>!data.has('q'+i))){root.querySelector('#quiz-feedback').textContent='Ответьте на все вопросы.';return}const correct=q.questions.reduce((n,item,i)=>n+(Number(data.get('q'+i))===item.correct?1:0),0);const score=Math.round(correct/q.questions.length*100);progress.scores[q.id]=score;save();root.querySelector('#quiz-feedback').textContent=`Результат: ${correct} из ${q.questions.length} (${score}%).`;e.currentTarget.querySelector('button[type=submit]').textContent='Готово';e.currentTarget.querySelector('button[type=submit]').disabled=true;setTimeout(()=>{root.innerHTML='';go('tests')},1300)})}
    function modalClose(){const root=document.querySelector('#modal-root');root.querySelector('[data-close]')?.addEventListener('click',()=>root.innerHTML='');root.querySelector('[data-dismiss]')?.addEventListener('click',e=>{if(e.target===e.currentTarget)root.innerHTML=''});document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){root.innerHTML='';document.removeEventListener('keydown',esc)}})}
    function registerLearningTools(){const context=document.modelContext;if(!context?.registerTool)return;const lifecycle=new AbortController();try{void Promise.resolve(context.registerTool({name:'get_learning_progress',title:'Посмотреть прогресс обучения',description:'Показывает число пройденных тем, прогресс по каждому курсу и последние результаты тестов.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){return {completedTopics:doneCount(),totalTopics,courses:courses.map(c=>({id:c.id,title:c.title,completed:courseDone(c.id),completedTopics:c.topics.filter((_,i)=>progress.topics[c.id+'-'+i]).length,totalTopics:c.topics.length})),quizScores:progress.scores||{}}}},{signal:lifecycle.signal})).catch(()=>{});void Promise.resolve(context.registerTool({name:'set_learning_topic_status',title:'Отметить тему пройденной',description:'Отмечает тему курса как пройденную или непройденную и обновляет прогресс в кабинете.',inputSchema:{type:'object',properties:{courseId:{type:'string',enum:courses.map(c=>c.id)},topicIndex:{type:'integer',minimum:0},completed:{type:'boolean'}},required:['courseId','topicIndex','completed'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){const course=courses.find(c=>c.id===input?.courseId);if(!course||!Number.isInteger(input.topicIndex)||input.topicIndex<0||input.topicIndex>=course.topics.length||typeof input.completed!=='boolean')throw new Error('Укажите существующий курс, номер темы и статус прохождения.');const key=course.id+'-'+input.topicIndex;progress.topics[key]=input.completed;save();go(activeView);return {course:course.title,topic:course.topics[input.topicIndex],completed:input.completed,completedTopics:doneCount(),totalTopics}}},{signal:lifecycle.signal})).catch(()=>{})}catch{}}
    registerLearningTools();
    renderOverview();
  </script>
</body>
</html>
